<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cordme & tubeme ecosystem</title>
    <!-- JSZip for handling random pfp zip files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --retro-bg: #121212;
            --retro-panel: #1e1e1e;
            --retro-border: #333333;
            --retro-green: #00ff66;
            --retro-green-hover: #00cc52;
            --retro-text: #00ff66;
            --retro-text-dim: #888888;
            --retro-white: #ffffff;
            --retro-danger: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: var(--retro-bg);
            color: var(--retro-text);
        }

        .hidden { display: none !important; }

        /* AUTH SCREEN */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--retro-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background-color: var(--retro-panel);
            border: 2px solid var(--retro-green);
            padding: 32px;
            width: 420px;
            box-shadow: 6px 6px 0px var(--retro-green);
        }

        .auth-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--retro-green);
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-subtitle {
            font-size: 12px;
            color: var(--retro-text-dim);
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--retro-text-dim);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            background-color: var(--retro-bg);
            border: 1px solid var(--retro-green);
            padding: 10px;
            color: var(--retro-white);
            font-size: 14px;
            outline: none;
        }

        .btn-retro {
            width: 100%;
            background-color: var(--retro-green);
            color: var(--retro-bg);
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.1s;
        }

        .btn-retro:hover {
            background-color: var(--retro-green-hover);
        }

        .auth-switch {
            margin-top: 16px;
            font-size: 12px;
            text-align: center;
            color: var(--retro-text-dim);
        }

        .auth-switch span {
            color: var(--retro-green);
            cursor: pointer;
            text-decoration: underline;
        }

        /* ECOSYSTEM APPS CONTAINER */
        .app-view {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Ecosystem Navbar */
        .ecosystem-nav {
            height: 40px;
            background-color: var(--retro-panel);
            border-bottom: 2px solid var(--retro-green);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .ecosystem-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--retro-green);
            text-transform: uppercase;
        }

        .ecosystem-buttons {
            display: flex;
            gap: 8px;
        }

        .eco-tab-btn {
            background-color: var(--retro-bg);
            border: 1px solid var(--retro-green);
            color: var(--retro-green);
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .eco-tab-btn.active, .eco-tab-btn:hover {
            background-color: var(--retro-green);
            color: var(--retro-bg);
        }

        .eco-close-btn {
            background-color: var(--retro-danger);
            border: 1px solid var(--retro-white);
            color: var(--retro-white);
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        /* APP 1: CORDME */
        #cordme-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .servers-sidebar {
            width: 64px;
            background-color: var(--retro-panel);
            border-right: 2px solid var(--retro-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
            flex-shrink: 0;
        }

        .server-icon {
            width: 44px;
            height: 44px;
            border: 1px solid var(--retro-green);
            background-color: var(--retro-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--retro-green);
            font-weight: bold;
            cursor: pointer;
            background-size: cover;
            background-position: center;
        }

        .server-icon:hover, .server-icon.active {
            background-color: var(--retro-green);
            color: var(--retro-bg);
        }

        .channels-sidebar {
            width: 220px;
            background-color: var(--retro-panel);
            border-right: 2px solid var(--retro-green);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .server-header {
            height: 40px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--retro-border);
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .channel-item {
            padding: 6px 8px;
            color: var(--retro-text-dim);
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .channel-item:hover, .channel-item.active {
            color: var(--retro-green);
            background-color: rgba(0, 255, 102, 0.1);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--retro-bg);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-row {
            font-size: 13px;
            line-height: 1.4;
        }

        .message-author {
            color: var(--retro-green);
            font-weight: bold;
        }

        .message-time {
            color: var(--retro-text-dim);
            font-size: 10px;
            margin-left: 6px;
        }

        .chat-input-box {
            padding: 12px;
            background-color: var(--retro-panel);
            border-top: 1px solid var(--retro-green);
        }

        .chat-input-box input {
            width: 100%;
            background-color: var(--retro-bg);
            border: 1px solid var(--retro-green);
            padding: 10px;
            color: var(--retro-white);
            font-size: 13px;
            outline: none;
        }

        /* APP 2: TUBEME */
        #tubeme-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--retro-bg);
            overflow-y: auto;
            padding: 24px;
        }

        .tubeme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--retro-green);
            padding-bottom: 12px;
        }

        .tubeme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .video-card {
            background-color: var(--retro-panel);
            border: 1px solid var(--retro-green);
            padding: 12px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .video-card:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px var(--retro-green);
        }

        .video-thumb {
            width: 100%;
            height: 140px;
            background-color: var(--retro-bg);
            border: 1px solid var(--retro-border);
            margin-bottom: 10px;
            background-size: cover;
            background-position: center;
        }

        .video-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--retro-white);
            margin-bottom: 4px;
        }

        .video-creator {
            font-size: 11px;
            color: var(--retro-green);
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-title" id="auth-title">cordme & tubeme</div>
            <div class="auth-subtitle" id="auth-subtitle">Retro Terminal Access</div>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="auth-username" placeholder="Enter username...">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="auth-password" placeholder="Enter password...">
            </div>

            <button class="btn-retro" id="auth-submit-btn" onclick="handleAuth()">Initialize Login</button>
            
            <div class="auth-switch" id="auth-switch-text">
                No account? <span onclick="toggleAuthMode()">Register profile</span>
            </div>
        </div>
    </div>

    <!-- MAIN APP ECOSYSTEM CONTAINER -->
    <div id="ecosystem-container" class="app-view hidden">
        <!-- Ecosystem Top Navigation Bar -->
        <div class="ecosystem-nav">
            <div class="ecosystem-title" id="eco-status-title">cordme // active session</div>
            <div class="ecosystem-buttons">
                <button class="eco-tab-btn active" id="btn-tab-cordme" onclick="switchEcosystemApp('cordme')">CordMe</button>
                <button class="eco-tab-btn" id="btn-tab-tubeme" onclick="switchEcosystemApp('tubeme')">TubeMe</button>
                <button class="eco-close-btn" onclick="handleLogout()">[ X Exit ]</button>
            </div>
        </div>

        <!-- APP 1: CORDME VIEW -->
        <div id="cordme-container">
            <div class="servers-sidebar">
                <div class="server-icon active" onclick="switchServer('dm')" title="Direct Messages">DM</div>
                <div class="server-icon" onclick="openCreateServer()" title="Create Server">+</div>
            </div>
            <div class="channels-sidebar">
                <div class="server-header" id="current-server-title">Direct Messages</div>
                <div class="channels-list" id="channels-list-container">
                    <div class="channel-item active" onclick="switchChannel('dm-cordme', '@cordme')"># @cordme</div>
                </div>
            </div>
            <div class="chat-area">
                <div class="chat-messages" id="chat-messages-container"></div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="Type message in terminal..." onkeydown="handleChatInput(event)">
                </div>
            </div>
        </div>

        <!-- APP 2: TUBEME VIEW -->
        <div id="tubeme-container" class="hidden">
            <div class="tubeme-header">
                <div>
                    <div style="font-size: 18px; font-weight: bold; color: var(--retro-green);">tubeme // retro video network</div>
                    <div style="font-size: 11px; color: var(--retro-text-dim);">Content published by cordme users</div>
                </div>
                <button class="eco-tab-btn" onclick="publishVideoModal()">+ Publish Video</button>
            </div>
            <div class="tubeme-grid" id="tubeme-grid-container"></div>
        </div>
    </div>

    <script>
        let db = {
            users: JSON.parse(localStorage.getItem('retro_users')) || {
                "@cordme": { username: "@cordme", password: "sys" }
            },
            servers: JSON.parse(localStorage.getItem('retro_servers')) || {
                'server_general': { id: 'server_general', name: 'Retro Hub', owner: '@cordme', channels: [{ id: 'ch_gen', name: 'general' }] }
            },
            messages: JSON.parse(localStorage.getItem('retro_messages')) || {},
            videos: JSON.parse(localStorage.getItem('retro_videos')) || [
                { id: '1', title: 'Building a Custom C++ Engine', creator: '@cordme', thumb: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400' },
                { id: '2', title: 'Roblox Luau UI Scripts', creator: 'amr010920', thumb: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400' }
            ]
        };

        let currentUser = localStorage.getItem('retro_current_user') || null;
        let isRegister = false;
        let activeApp = 'cordme';
        let currentServer = 'dm';
        let currentChannel = 'dm-cordme';

        function saveDB() {
            localStorage.setItem('retro_users', JSON.stringify(db.users));
            localStorage.setItem('retro_servers', JSON.stringify(db.servers));
            localStorage.setItem('retro_messages', JSON.stringify(db.messages));
            localStorage.setItem('retro_videos', JSON.stringify(db.videos));
        }

        window.onload = function() {
            if (currentUser && db.users[currentUser]) {
                bootApp();
            }
        };

        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? 'Register Profile' : 'cordme & tubeme';
            document.getElementById('auth-submit-btn').innerText = isRegister ? 'Create Profile' : 'Initialize Login';
            document.getElementById('auth-switch-text').innerHTML = isRegister ? 
                'Have profile? <span onclick="toggleAuthMode()">Login</span>' : 
                'No account? <span onclick="toggleAuthMode()">Register profile</span>';
        }

        function handleAuth() {
            const u = document.getElementById('auth-username').value.trim();
            const p = document.getElementById('auth-password').value.trim();
            if (!u || !p) return alert('Enter credentials.');

            if (isRegister) {
                if (db.users[u]) return alert('User exists.');
                db.users[u] = { username: u, password: p };
                saveDB();
                alert('Registered! Please login.');
                toggleAuthMode();
            } else {
                if (!db.users[u] || db.users[u].password !== p) return alert('Invalid login.');
                currentUser = u;
                localStorage.setItem('retro_current_user', u);
                saveDB();
                bootApp();
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('retro_current_user');
            location.reload();
        }

        function bootApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('ecosystem-container').classList.remove('hidden');
            renderServers();
            switchServer('dm');
            renderTubeMe();
        }

        function switchEcosystemApp(app) {
            activeApp = app;
            document.getElementById('btn-tab-cordme').classList.remove('active');
            document.getElementById('btn-tab-tubeme').classList.remove('active');
            document.getElementById('cordme-container').classList.add('hidden');
            document.getElementById('tubeme-container').classList.add('hidden');

            if (app === 'cordme') {
                document.getElementById('btn-tab-cordme').classList.add('active');
                document.getElementById('cordme-container').classList.remove('hidden');
                document.getElementById('eco-status-title').innerText = 'cordme // active session';
            } else {
                document.getElementById('btn-tab-tubeme').classList.add('active');
                document.getElementById('tubeme-container').classList.remove('hidden');
                document.getElementById('eco-status-title').innerText = 'tubeme // video network';
                renderTubeMe();
            }
        }

        function renderServers() {
            const sidebar = document.querySelector('.servers-sidebar');
            sidebar.innerHTML = `
                <div class="server-icon ${currentServer === 'dm' ? 'active' : ''}" onclick="switchServer('dm')">DM</div>
                <div class="server-icon ${currentServer === 'server_general' ? 'active' : ''}" onclick="switchServer('server_general')">R</div>
            `;
        }

        function switchServer(sId) {
            currentServer = sId;
            renderServers();
            const list = document.getElementById('channels-list-container');
            list.innerHTML = '';

            if (sId === 'dm') {
                document.getElementById('current-server-title').innerText = 'Direct Messages';
                list.innerHTML = `<div class="channel-item active" onclick="switchChannel('dm-cordme', '@cordme')"># @cordme</div>`;
                switchChannel('dm-cordme', '@cordme');
            } else {
                document.getElementById('current-server-title').innerText = 'Retro Hub';
                list.innerHTML = `<div class="channel-item active" onclick="switchChannel('ch_gen', 'general')"># general</div>`;
                switchChannel('ch_gen', 'general');
            }
        }

        function switchChannel(chId, chName) {
            currentChannel = chId;
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages-container');
            container.innerHTML = '';
            const key = `${currentServer}_${currentChannel}`;
            const msgs = db.messages[key] || [];

            msgs.forEach(m => {
                const row = document.createElement('div');
                row.className = 'message-row';
                row.innerHTML = `<span class="message-author">${m.sender}</span><span class="message-time">${m.time}</span><div style="color: #ccc;">${m.text}</div>`;
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleChatInput(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (!text) return;

                const key = `${currentServer}_${currentChannel}`;
                if (!db.messages[key]) db.messages[key] = [];

                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                db.messages[key].push({ sender: currentUser, text: text, time: timeStr });
                input.value = '';
                saveDB();
                renderMessages();
            }
        }

        function renderTubeMe() {
            const grid = document.getElementById('tubeme-grid-container');
            grid.innerHTML = '';

            db.videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-thumb" style="background-image: url('${v.thumb}')"></div>
                    <div class="video-title">${v.title}</div>
                    <div class="video-creator">${v.creator}</div>
                `;
                grid.appendChild(card);
            });
        }

        function publishVideoModal() {
            const title = prompt('Enter video title:');
            if (!title) return;
            db.videos.unshift({
                id: 'v_' + Math.random(),
                title: title,
                creator: currentUser,
                thumb: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400'
            });
            saveDB();
            renderTubeMe();
        }
    </script>
</body>
</html>
